# ci.yml
# Purpose: on every push and pull request, install, lint, type check, test and build.
# Inputs: the repository contents; the Node version comes from .nvmrc.
# Outputs: a pass/fail check on the commit.
name: ci

on: [push, pull_request]

# The workflow only reads the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # same Node version as local development
          cache: npm
      - run: npm ci # exact versions from package-lock.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # runs "vitest run", which exits after one pass
      - run: npm run build
