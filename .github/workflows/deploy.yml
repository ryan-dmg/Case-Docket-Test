# deploy.yml
# Purpose: build the site and publish it to GitHub Pages when main changes.
# Inputs: the repository contents; Pages must be set to the "GitHub Actions" source.
# Outputs: the live site at https://<owner>.github.io/<repo-name>/
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# The minimum rights Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/ # Pages serves under the repo name
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
